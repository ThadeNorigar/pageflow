modules:
  confluence:globalPage:
    - key: confluence-importer-global
      resource: frontend
      resolver:
        function: resolver
      route: confluence-importer
      title: ConfluenceImporter
  function:
    - key: resolver
      handler: index.handler
      providers:
        auth:
          - microsoft-graph
providers:
  auth:
    - key: microsoft-graph
      name: Microsoft OneNote
      type: oauth2
      clientId: 724d3f03-aef2-46c3-986e-9a92245b1bdb
      scopes:
        - openid
        - profile
        - offline_access
        - User.Read
        - Notes.Read.All
      remotes:
        - microsoft-graph-api
      bearerMethod: authorization-header
      actions:
        authorization:
          remote: microsoft-login
          path: /common/oauth2/v2.0/authorize
        exchange:
          remote: microsoft-login
          path: /common/oauth2/v2.0/token
        refreshToken:
          remote: microsoft-login
          path: /common/oauth2/v2.0/token
        revokeToken:
          remote: microsoft-login
          path: /common/oauth2/v2.0/logout
        retrieveProfile:
          remote: microsoft-graph-api
          path: /v1.0/me
          resolvers:
            id: id
            displayName: displayName
remotes:
  - key: microsoft-login
    baseUrl: https://login.microsoftonline.com
  - key: microsoft-graph-api
    baseUrl: https://graph.microsoft.com
resources:
  - key: frontend
    path: src/frontend/build
permissions:
  scopes:
    - read:confluence-content.all
    - read:confluence-space.summary
    - read:space:confluence
    - read:page:confluence
    - read:folder:confluence
    - write:confluence-file
    - write:page:confluence
    - write:attachment:confluence
  external:
    fetch:
      backend:
        - address: https://login.microsoftonline.com
        - address: https://graph.microsoft.com
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/335e32c0-a0a1-4b73-ac90-6a417a720c1d
