name: OneNote Secret Health

# Microsoft verschickt bei Client Secrets KEINE Ablaufwarnung (nur bei SAML-Zertifikaten).
# Forge kann die eigene Provider-Konfiguration nicht auslesen. Ohne diesen Job ist der
# erste Hinweis auf ein kaputtes Secret ein Kunde, der sich beschwert — genau so ist der
# Ausfall vom August 2026 entstanden.
#
# Siehe docs/runbooks/onenote-oauth.md, Abschnitt 7.

on:
  schedule:
    # Taeglich 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Client Secret gegen Microsoft pruefen
        env:
          # Oeffentlich: die clientId steht im versionierten manifest.yml und wird
          # an alle Marketplace-Kunden ausgeliefert.
          CLIENT_ID: 724d3f03-aef2-46c3-986e-9a92245b1bdb
          CLIENT_SECRET: ${{ secrets.MS_GRAPH_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CLIENT_SECRET}" ]; then
            echo "::error::Repository-Secret MS_GRAPH_CLIENT_SECRET ist nicht gesetzt."
            echo "Ohne Secret prueft dieser Job nichts. Lieber laut scheitern als still gruen sein."
            exit 1
          fi

          # client_credentials prueft die Client-Authentifizierung direkt.
          # Wichtig: der refresh_token-Grant taugt NICHT dafuer — Entra weist einen
          # ungueltigen Grant mit AADSTS9002313 zurueck, BEVOR es das Secret prueft.
          # Verifiziert am 21.08.2026.
          RESPONSE=$(curl -sS --max-time 30 \
            -X POST "https://login.microsoftonline.com/common/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default")

          # Die App hat keine Application Permissions, ein Erfolg ist also nicht zu erwarten.
          # Entscheidend ist allein, WELCHER Fehler kommt.
          if echo "$RESPONSE" | grep -q "AADSTS7000215"; then
            echo "::error::Client Secret ist UNGUELTIG (AADSTS7000215). OneNote-Import ist bei allen Kunden tot."
            echo "Sofortmassnahme: docs/runbooks/onenote-oauth.md Abschnitt 3."
            exit 1
          fi

          if echo "$RESPONSE" | grep -q "AADSTS7000222"; then
            echo "::error::Client Secret ist ABGELAUFEN (AADSTS7000222). OneNote-Import ist bei allen Kunden tot."
            echo "Sofortmassnahme: docs/runbooks/onenote-oauth.md Abschnitt 5.1 (Rotation)."
            exit 1
          fi

          if echo "$RESPONSE" | grep -q "AADSTS700016"; then
            echo "::error::App-Registrierung nicht gefunden (AADSTS700016). Wurde sie geloescht?"
            exit 1
          fi

          echo "Client Secret ist gueltig."
          # Antwort bewusst nicht ausgeben: sie enthaelt zwar kein Secret, aber Trace- und
          # Correlation-IDs, die nicht ins oeffentliche Aktionsprotokoll gehoeren.
